<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duck Life 5: Treasure Hunt</title>

  <!-- Ruffle Flash emulator -->
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #f4ea95;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    .topbar {
      width: 100%;
      height: 55px;
      background: #222;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
    }

    .back {
      color: white;
      text-decoration: none;
      background: #444;
      padding: 8px 14px;
      border-radius: 6px;
    }

    .back:hover {
      background: #666;
    }

    .game-container {
      margin-top: 20px;
      position: relative;
      background: black;
      width: 800px;
      height: 600px;
      max-width: 95vw;
      max-height: 80vh;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
    }

    embed {
      width: 800px;
      height: 600px;
      max-width: 100%;
      max-height: 100%;
      display: block;
    }

    .info {
      margin-top: 10px;
      color: #333;
      font-size: 14px;
    }

    @media (max-width: 820px) {
      .game-container {
        width: 95vw;
        height: calc(95vw * 0.75);
      }

      embed {
        width: 100%;
        height: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="title">Duck Life 5: Treasure Hunt</div>
    <a class="back" href="index.html">Main Menu</a>
  </div>

  <div class="game-container">
    <embed
      src="treasure_hunt.swf"
      type="application/x-shockwave-flash"
      width="800"
      height="600">
  </div>

  <div class="info">
    Right-click the game for fullscreen options.
  </div>

</body>
</html>
